server:
  port: 8080
  readTimeout: 5s
  writeTimeout: 10s
  readHeaderTimeout: 5s
  
backends:
  - url: "http://backend1"
    weight: 1
  - url: "http://backend2"
    weight: 1
  - url: "http://backend3"
    weight: 1
    
loadbalancing:
  algorithm: "round-robin"  # Доступные алгоритмы: round-robin, least-connections, random
  healthCheckInterval: 10s
  healthCheckTimeout: 2s
  
rateLimiting:
  defaultCapacity: 100 
  defaultRatePerSecond: 10
  enabled: true
  storageType: "postgres"  # Тип хранилища: postgres или memory
  
database:
  host: "postgres"
  port: 5432
  user: "postgres"
  password: "postgres" 
  dbname: "balancer"
  sslmode: "disable"
  
logging:
  level: "info"  # debug, info, warn, error
  format: "json"  # json или text 