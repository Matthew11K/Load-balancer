services:
  balancer:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
      - backend1
      - backend2
      - backend3
    ports:
      - "8080:8080"
    environment:
      - TZ=Europe/Moscow
    volumes:
      - ./config.yaml:/app/config.yaml
    networks:
      - balancer-network

  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: balancer
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - balancer-network

  # Тестовые бэкенд-серверы
  backend1:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./test/backend1.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"
    networks:
      - balancer-network

  backend2:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./test/backend2.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8082:80"
    networks:
      - balancer-network

  backend3:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./test/backend3.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8083:80"
    networks:
      - balancer-network

networks:
  balancer-network:
    driver: bridge

volumes:
  postgres-data:
